<svg width="100%" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CartSight Project Workflow</title>
<desc>End-to-end workflow from Kaggle data download to Power BI dashboard</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background -->
<rect width="680" height="580" fill="#0d1117" rx="12"/>

<!-- ── ROW 1: Steps 1-4 ── -->

<!-- Step 1: Kaggle -->
<rect x="20" y="30" width="130" height="72" rx="10" fill="#0c2d48" stroke="#1f6feb" stroke-width="1"/>
<text x="85" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#58a6ff">📥 Kaggle</text>
<text x="85" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">Download raw CSVs</text>

<!-- Arrow 1→2 -->
<line x1="150" y1="66" x2="178" y2="66" stroke="#1f6feb" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 2: Python Cleaning -->
<rect x="180" y="30" width="130" height="72" rx="10" fill="#0d2b1f" stroke="#238636" stroke-width="1"/>
<text x="245" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#3fb950">🧹 Python</text>
<text x="245" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">Clean &amp; preprocess</text>

<!-- Arrow 2→3 -->
<line x1="310" y1="66" x2="338" y2="66" stroke="#238636" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 3: Export CSV -->
<rect x="340" y="30" width="130" height="72" rx="10" fill="#2d1f00" stroke="#9e6a03" stroke-width="1"/>
<text x="405" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#e3b341">💾 Export</text>
<text x="405" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">Cleaned CSVs locally</text>

<!-- Arrow 3→4 -->
<line x1="470" y1="66" x2="498" y2="66" stroke="#9e6a03" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 4: MySQL -->
<rect x="500" y="30" width="155" height="72" rx="10" fill="#1f1235" stroke="#6e40c9" stroke-width="1"/>
<text x="577" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#a371f7">🗄️ MySQL</text>
<text x="577" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">Load via SQLAlchemy</text>

<!-- Arrow MySQL → Analysis -->
<line x1="577" y1="102" x2="577" y2="150" stroke="#6e40c9" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ── LIBRARIES BOX (left) ── -->
<rect x="20" y="155" width="170" height="190" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="105" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">📦 Libraries</text>
<text x="105" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">pandas · numpy</text>
<text x="105" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">sqlalchemy · pymysql</text>
<text x="105" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">matplotlib · seaborn</text>
<text x="105" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">scipy · statsmodels</text>
<text x="105" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">itertools</text>
<text x="105" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">jupyter notebook</text>
<text x="105" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">MySQL · Power BI</text>

<!-- ── ANALYSIS BOX ── -->
<rect x="210" y="152" width="445" height="80" rx="10" fill="#1a1f2a" stroke="#f78166" stroke-width="1"/>
<text x="432" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffa198">🔍 Python Analysis</text>
<text x="432" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">Jupyter · SQL queries · 14 Business Questions</text>
<text x="432" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">Matplotlib · Seaborn · SciPy · Chi-square · Z-test</text>

<!-- Arrow Analysis → 3 outputs (vertical down then split) -->
<line x1="432" y1="232" x2="432" y2="270" stroke="#555" stroke-width="1.2"/>
<line x1="298" y1="270" x2="620" y2="270" stroke="#555" stroke-width="1.2"/>
<line x1="298" y1="270" x2="298" y2="295" stroke="#238636" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="462" y1="270" x2="462" y2="295" stroke="#6e40c9" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="610" y1="270" x2="610" y2="295" stroke="#9e6a03" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ── ROW 3: Outputs ── -->

<!-- Word Report -->
<rect x="210" y="297" width="170" height="72" rx="10" fill="#0d2b1f" stroke="#238636" stroke-width="1"/>
<text x="295" y="325" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#3fb950">📄 Word Report</text>
<text x="295" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">Industry-level .docx</text>

<!-- PowerPoint -->
<rect x="397" y="297" width="130" height="72" rx="10" fill="#1f1235" stroke="#6e40c9" stroke-width="1"/>
<text x="462" y="325" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#a371f7">📊 Presentation</text>
<text x="462" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">PowerPoint .pptx</text>

<!-- Power BI -->
<rect x="544" y="297" width="130" height="72" rx="10" fill="#2d1f00" stroke="#9e6a03" stroke-width="1"/>
<text x="609" y="325" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#e3b341">📈 Power BI</text>
<text x="609" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">4-page dashboard</text>

<!-- Arrows from 3 outputs → final -->
<line x1="295" y1="369" x2="295" y2="420" stroke="#555" stroke-width="1.2"/>
<line x1="462" y1="369" x2="462" y2="420" stroke="#555" stroke-width="1.2"/>
<line x1="609" y1="369" x2="609" y2="420" stroke="#555" stroke-width="1.2"/>
<line x1="295" y1="420" x2="609" y2="420" stroke="#555" stroke-width="1.2"/>
<line x1="452" y1="420" x2="452" y2="450" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ── FINAL BOX ── -->
<rect x="210" y="452" width="480" height="72" rx="10" fill="#0d2b1f" stroke="#238636" stroke-width="1.5"/>
<text x="450" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#3fb950">✅ Project Complete — CartSight</text>
<text x="450" y="502" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e">Report · Presentation · Dashboard · GitHub Portfolio</text>

</svg>
